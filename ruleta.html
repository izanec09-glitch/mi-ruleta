<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruleta</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #0f0f0f, #1a1a2e);
      color: white;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: 2.8em;
      margin-bottom: 30px;
      text-shadow: 0 0 20px rgba(255,255,255,0.4);
    }
    canvas {
      border: 15px solid #ffffff22;
      border-radius: 50%;
      box-shadow: 0 0 60px rgba(0,0,0,0.7),
                  inset 0 0 50px rgba(255,255,255,0.15);
      background: #000;
    }
    button {
      margin-top: 40px;
      padding: 18px 60px;
      font-size: 28px;
      font-weight: bold;
      background: linear-gradient(45deg, #ff3366, #ff6699);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 35px rgba(255, 51, 102, 0.5);
      transition: all 0.3s;
    }
    button:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 45px rgba(255, 51, 102, 0.7);
    }
  </style>
</head>
<body>
  <h1>🎡 Ruleta</h1>
  <canvas id="wheel" width="560" height="560"></canvas>
  <button onclick="spin()">¡GIRAR!</button>

  <script>
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const centerX = 280;
    const centerY = 280;
    const radius = 250;

    const segments = [
      { color: '#22c55e', prob: 0.45 },   // Verde 45%
      { color: '#eab308', prob: 0.35 },   // Amarillo 35%
      { color: '#ef4444', prob: 0.20 }    // Rojo 20%
    ];

    let rotation = 0;
    let isSpinning = false;

    function drawWheel() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let startAngle = rotation;

      segments.forEach((seg) => {
        const angle = 2 * Math.PI * seg.prob;
        
        const grad = ctx.createRadialGradient(centerX*0.95, centerY*0.95, radius*0.3, centerX, centerY, radius);
        grad.addColorStop(0, seg.color);
        grad.addColorStop(1, '#111');

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, startAngle + angle);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.strokeStyle = '#ffffff44';
        ctx.lineWidth = 8;
        ctx.stroke();

        startAngle += angle;
      });

      // Centro
      ctx.beginPath();
      ctx.arc(centerX, centerY, 40, 0, Math.PI * 2);
      ctx.fillStyle = '#111';
      ctx.fill();
      ctx.strokeStyle = '#ddd';
      ctx.lineWidth = 10;
      ctx.stroke();

      // Flecha
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(centerX - 30, 75);
      ctx.lineTo(centerX + 30, 75);
      ctx.lineTo(centerX, 20);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    function spin() {
      if (isSpinning) return;
      isSpinning = true;

      const spinTime = 5000 + Math.random() * 2000;
      const totalRot = rotation + (Math.random() * 5 + 10) * Math.PI;

      let start = null;

      function animate(t) {
        if (!start) start = t;
        const progress = Math.min((t - start) / spinTime, 1);
        const ease = 1 - Math.pow(1 - progress, 4);

        rotation = totalRot * ease;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
        }
      }
      requestAnimationFrame(animate);
    }

    drawWheel();
  </script>
</body>
</html>
