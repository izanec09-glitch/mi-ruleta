<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruleta</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #0f0f0f, #1a1a2e);
      color: white;
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    h1 {
      font-size: 2.2em;
      margin: 10px 0 20px;
      text-shadow: 0 0 20px rgba(255,255,255,0.4);
    }
    .container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }
    canvas {
      width: 100%;
      height: auto;
      max-width: 520px;
      border: 12px solid #ffffff22;
      border-radius: 50%;
      box-shadow: 0 0 50px rgba(0,0,0,0.7),
                  inset 0 0 40px rgba(255,255,255,0.15);
      background: #000;
      touch-action: none;
    }
    button {
      margin-top: 30px;
      padding: 18px 50px;
      font-size: 1.8rem;
      font-weight: bold;
      background: linear-gradient(45deg, #ff3366, #ff6699);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255, 51, 102, 0.5);
      width: 90%;
      max-width: 320px;
    }
    button:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎡 Ruleta</h1>
    <canvas id="wheel" width="520" height="520"></canvas>
    <button onclick="spin()">¡GIRAR!</button>
  </div>

  <script>
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    let size = 520;
    let centerX = size / 2;
    let centerY = size / 2;
    let radius = size / 2 - 20;

    const segments = [
      { color: '#22c55e', prob: 0.45 },   // Verde 45%
      { color: '#eab308', prob: 0.35 },   // Amarillo 35%
      { color: '#ef4444', prob: 0.20 }    // Rojo 20%
    ];

    let rotation = 0;
    let isSpinning = false;

    function resizeCanvas() {
      const containerWidth = Math.min(window.innerWidth * 0.92, 520);
      canvas.style.width = containerWidth + 'px';
      canvas.style.height = containerWidth + 'px';
    }

    function drawWheel() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let startAngle = rotation;

      segments.forEach((seg) => {
        const angle = 2 * Math.PI * seg.prob;
        
        const grad = ctx.createRadialGradient(centerX*0.95, centerY*0.95, radius*0.3, centerX, centerY, radius);
        grad.addColorStop(0, seg.color);
        grad.addColorStop(1, '#111');

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, startAngle + angle);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.strokeStyle = '#ffffff44';
        ctx.lineWidth = 8;
        ctx.stroke();

        startAngle += angle;
      });

      // Centro
      ctx.beginPath();
      ctx.arc(centerX, centerY, 38, 0, Math.PI * 2);
      ctx.fillStyle = '#111';
      ctx.fill();
      ctx.strokeStyle = '#ddd';
      ctx.lineWidth = 10;
      ctx.stroke();

      // Flecha
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(centerX - 32, 80);
      ctx.lineTo(centerX + 32, 80);
      ctx.lineTo(centerX, 25);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    function spin() {
      if (isSpinning) return;
      isSpinning = true;

      const spinTime = 4800 + Math.random() * 2200;
      const totalRot = rotation + (Math.random() * 5 + 9) * Math.PI;

      let start = null;

      function animate(t) {
        if (!start) start = t;
        const progress = Math.min((t - start) / spinTime, 1);
        const ease = 1 - Math.pow(1 - progress, 4);

        rotation = totalRot * ease;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
        }
      }
      requestAnimationFrame(animate);
    }

    // Inicializar
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    drawWheel();
  </script>
</body>
</html>
